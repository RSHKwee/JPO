plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.4.0'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.graalvm.buildtools.native' version '1.1.2'
}

group = 'org.jpo'
version = '25.0.9'
description = 'api'

// Juiste plek voor source/target compatibility
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
}

dependencies {
    implementation project(':core')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin' 
    
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
}

kotlin {
    // Geen toolchain, gebruikt systeem-JDK (Java 26 via gradle.properties)
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    environment = System.getenv()
}

tasks.named('processResources') {
    dependsOn ':angular:angularBuild'
}

bootBuildImage {
    dependsOn ':angular:angularBuild'
    def isNative = project.findProperty('native')?.toString() == 'true'

    project.logger.lifecycle(">>> Configuring bootBuildImage: native=${isNative}")

    imageName = "${dockerHubUsername}/jpoviewer:latest"
    tags = ["${dockerHubUsername}/jpoviewer:${version}"]

    if (isNative) {
        builder = "paketobuildpacks/builder-jammy-tiny"
        environment = [
                "BP_NATIVE_IMAGE": "true"
        ]
    } else {
        builder = "paketobuildpacks/builder-jammy-base"
        buildpacks = ["paketo-buildpacks/java"]
        environment = [
                "BP_NATIVE_IMAGE": "false",
                "BP_JVM_VERSION": "25",
                "JAVA_TOOL_OPTIONS": "-XX:MaxDirectMemorySize=256M"
        ]
    }
}

tasks.register('pushDocker', Exec) {
    dependsOn 'bootBuildImage'
    group = 'docker'
    commandLine 'sh', '-c', "docker push ${dockerHubUsername}/jpoviewer:${version} && docker push ${dockerHubUsername}/jpoviewer:latest"
}